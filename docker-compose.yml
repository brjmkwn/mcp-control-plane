services:
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-control-plane-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - MCP_TOKENS_JSON={"admin-token":{"client_id":"admin-svc","scopes":["admin","read:db","read:github","write:github","read:ops"]},"analytics-token":{"client_id":"analytics-agent","scopes":["read:db"]},"triage-token":{"client_id":"triage-bot","scopes":["read:github","write:github"]},"ops-token":{"client_id":"monitoring-agent","scopes":["read:ops"]}}
      - MCP_CONFIRMATION_SECRET=secure-production-random-secret-key-at-least-32-chars
      - DATABASE_URL=postgresql://mcp_user:mcp_password@postgres:5432/mcp_db
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_PROVIDER_MODE=mock
      - PROMETHEUS_URL=http://prometheus:9090
      - MCP_TEST_MODE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
      POSTGRES_DB: mcp_db
    ports:
      - "5432:5432"
    volumes:
      - ./config/seed_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mcp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - mcp-gateway

volumes:
  pgdata:
  redisdata:
